# Delete branches nobody works on any more, by name, on demand. The steps
# and the safety rules (never the default branch, never one an open PR
# points at) are OpsScripts' prune-branches.yml.

name: Prune branches

on:
  workflow_dispatch:
    inputs:
      branches:
        description: Branch names to delete, separated by spaces
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    uses: BenCohen1988/OpsScripts/.github/workflows/prune-branches.yml@v1
    with:
      branches: ${{ inputs.branches }}
