name: Enforce formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-format
  cancel-in-progress: false

jobs:
  format:
    uses: BenCohen1988/OpsScripts/.github/workflows/auto-format.yml@v1
    with:
      # Public repo: GitHub's runner, never the self-hosted VM (see ci.yml).
      runs-on: '["ubuntu-latest"]'
